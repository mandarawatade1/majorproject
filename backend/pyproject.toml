[project]
name = "pce-kms-backend"
version = "0.1.0"
description = "AI-Based Institute Knowledge Management using Open-Source LLM and RAG — API layer"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH"]
ignore = ["B008"]   # FastAPI's Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]
"alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires live postgres/redis/chroma/ollama services",
]
