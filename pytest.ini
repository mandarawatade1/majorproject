# Repo-root pytest configuration.
#
# The project has two importable packages that live side by side:
#   backend/app  the API layer
#   rag          the knowledge service
#
# They are tested together from the repo root so that a change in one is
# checked against the other. backend/pyproject.toml still configures ruff and
# mypy for the backend package specifically.
[pytest]
testpaths = backend/tests rag/tests
pythonpath = . backend
addopts = -q --strict-markers
markers =
    integration: requires live postgres/redis/chroma/ollama services
